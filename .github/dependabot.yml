# Weekly update PRs for npm packages and the pinned GitHub Actions.
# Minor and patch bumps are grouped to keep the noise down.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
