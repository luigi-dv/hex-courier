name: CI

on:
  pull_request:
  push:
    branches: [master]

# Read-only token: nothing here writes to the repository.
permissions:
  contents: read

# Actions are pinned to full commit SHAs, not tags: a tag can be moved after
# review, a SHA cannot. The comment says which release each SHA is.
jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Keeps the README numbers honest: fails loudly if the script breaks
      - run: npm run benchmark
